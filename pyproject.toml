[project]
name = "technikal-assesment"
version = "0.1.0"
description = "Storage App"
authors = [
    {name = "AlexZha-dev",email = "oleksandr.zhabchenko.work@outlook.com"}
]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django (>=6.1.1,<7.0.0)",
    "djangorestframework (>=3.18.0,<4.0.0)",
    "gunicorn (>=26.2.0,<27.0.0)",
    "psycopg[binary] (>=3.3.5,<4.0.0)",
    "django-environ (>=0.14.0,<0.15.0)",
    "whitenoise (>=6.12.0,<7.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-django (>=4.14.0,<5.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]
